<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate warning</title>
<style>
:root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #861827; color: #fff; }
body { margin: 0; }
main { box-sizing: border-box; width: min(100%, 39rem); margin: 0 auto; padding: clamp(2rem, 10vh, 6rem) 1.5rem 2rem; }
svg { width: 64px; height: 64px; color: #ffd9dc; }
h1 { margin: 1rem 0; font-size: clamp(1.75rem, 6vw, 2.75rem); line-height: 1.12; }
p { line-height: 1.55; color: #ffe7e9; }
.actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.75rem; }
button { padding: .7rem 1rem; border: 1px solid #ffd9dc; border-radius: 999px; font: inherit; font-weight: 600; color: #60101a; background: #ffe0e2; }
button.secondary { color: #fff; background: transparent; }
button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
#code { font-size: .85rem; overflow-wrap: anywhere; }
</style>
<main>
<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm3.71 14.29-1.42 1.42L12 14.41l-2.29 2.3-1.42-1.42L10.59 13l-2.3-2.29 1.42-1.42 2.29 2.3 2.29-2.3 1.42 1.42L13.41 13l2.3 2.29z"/></svg>
<h1 id="heading">This Connection Uses an Untrusted Certificate</h1>
<p>An attacker could be intercepting your connection. Information you send to this site, including passwords and payment details, could be exposed.</p>
<p id="code" hidden></p>
<div class="actions">
<button id="back">Go back</button>
<button id="continue" class="secondary" hidden>Continue Anyway</button>
</div>
<p id="result" role="status"></p>
</main>
<script>
const heading = document.querySelector("#heading");
const proceed = document.querySelector("#continue");
const params = new URLSearchParams(location.search);
if (params.has("tls")) heading.textContent = "This Connection Could Not Be Secured";
try {
  const error = document.getFailedCertSecurityInfo();
  const code = error?.errorCodeString || "";
  if (code.includes("EXPIRED")) heading.textContent = "This Connection Uses an Expired Certificate";
  else if (code.includes("NOT_YET_VALID")) heading.textContent = "This Connection Uses a Certificate That Is Not Yet Valid";
  else if (code.includes("BAD_CERT_DOMAIN")) heading.textContent = "This Connection Uses a Certificate for a Different Site";
  else if (code.includes("REVOKED")) heading.textContent = "This Connection Uses a Revoked Certificate";
  else if (code.includes("SELF_SIGNED")) heading.textContent = "This Connection Uses a Self-Signed Certificate";
  if (code) {
    const details = document.querySelector("#code");
    details.textContent = code;
    details.hidden = false;
  }
  proceed.hidden = params.has("hsts") || params.has("tls") ||
    !error?.errorIsOverridable || error.hasHSTS || error.hasHPKP;
} catch (_) {}
document.querySelector("#back").onclick = () => history.back();
proceed.onclick = async () => {
  proceed.disabled = true;
  try {
    await document.addCertException(true);
    location.reload();
  } catch (_) {
    document.querySelector("#result").textContent = "This certificate exception could not be added.";
  } finally {
    proceed.disabled = false;
  }
};
</script>
</html>
